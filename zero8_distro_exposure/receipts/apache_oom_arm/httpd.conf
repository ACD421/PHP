ServerName localhost
Listen 127.0.0.1:18261
PidFile /tmp/lc_ap2/httpd.pid
ErrorLog /tmp/lc_ap2/error.log
LogLevel warn
TypesConfig /etc/mime.types
LoadModule mpm_prefork_module /usr/lib/apache2/modules/mod_mpm_prefork.so
LoadModule authz_core_module /usr/lib/apache2/modules/mod_authz_core.so
LoadModule dir_module /usr/lib/apache2/modules/mod_dir.so
LoadModule mime_module /usr/lib/apache2/modules/mod_mime.so
LoadModule php_module /usr/lib/apache2/modules/libphp8.1.so
DocumentRoot /tmp/lc_ap2/html
<Directory /tmp/lc_ap2/html>
  Require all granted
  DirectoryIndex index.php
  php_admin_value session.save_path /tmp/lc_ap2/sess
  php_admin_value session.upload_progress.min_freq 0
  php_admin_value session.upload_progress.freq 1
  php_admin_value session.upload_progress.prefix upload_progress_
  php_admin_flag display_errors on
  php_admin_value memory_limit 8M
  php_admin_value post_max_size 64M
  php_admin_value upload_max_filesize 60M
  php_admin_value max_file_uploads 50
</Directory>
<FilesMatch \.php$>
  SetHandler application/x-httpd-php
</FilesMatch>
MaxRequestWorkers 1
